<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Student Services Portal</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
        }

        header {
            background: #1f4e79;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 85%;
            max-width: 900px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        .tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 25px;
        }

        .tabs button {
            padding: 12px;
            border: none;
            background: #ddd;
            cursor: pointer;
            border-radius: 5px;
        }

        .tabs button:hover {
            background: #bbb;
        }

        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        input[type="file"] {
            padding: 8px;
        }

        .submit {
            margin-top: 25px;
            padding: 12px;
            width: 100%;
            background: #1f4e79;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        h2 {
            color: #1f4e79;
        }
    </style>
</head>

<body>

<header>
    <h1>Student Services Portal</h1>
    <p>Demo Portal for FormGuard AI</p>
</header>

<div class="container">

    <div class="tabs">
        <button onclick="showForm('scholarship')">Scholarship</button>
        <button onclick="showForm('fee')">Fee Payment</button>
        <button onclick="showForm('exam')">Exam Registration</button>
        <button onclick="showForm('course')">Course Registration</button>
        <button onclick="showForm('certificate')">Certificate</button>
    </div>


    <!-- SCHOLARSHIP -->

    <div id="scholarship" class="form-section active">

        <h2>Scholarship Application</h2>

        <form>

            <label>Student Name</label>
            <input type="text" name="studentName">

            <label>Application Number</label>
            <input type="text" name="applicationNumber">

            <label>Income Certificate Number</label>
            <input type="text" name="certificateNumber">

            <label>ID Proof</label>
            <input type="file" id="idProof">

            <label>Income Certificate</label>
            <input type="file" id="incomeCertificate">

            <label>Marks Memo</label>
            <input type="file" id="marksMemo">

            <button class="submit">Submit Scholarship Application</button>

        </form>

    </div>


    <!-- FEE PAYMENT -->

    <div id="fee" class="form-section">

        <h2>Fee Payment Form</h2>

        <form>

            <label>Student Name</label>
            <input type="text">

            <label>Student ID</label>
            <input type="text">

            <label>Semester</label>
            <select>
                <option>Select Semester</option>
                <option>Semester 1</option>
                <option>Semester 2</option>
                <option>Semester 3</option>
                <option>Semester 4</option>
            </select>

            <label>Fee Receipt</label>
            <input type="file" id="feeReceipt">

            <button class="submit">Submit Fee Payment</button>

        </form>

    </div>


    <!-- EXAM REGISTRATION -->

    <div id="exam" class="form-section">

        <h2>Exam Registration</h2>

        <form>

            <label>Student Name</label>
            <input type="text">

            <label>Student ID</label>
            <input type="text">

            <label>Exam</label>
            <select>
                <option>Select Exam</option>
                <option>Mid Examination</option>
                <option>Semester Examination</option>
                <option>Supplementary Examination</option>
            </select>

            <label>Hall Ticket / ID Proof</label>
            <input type="file" id="examIdProof">

            <label>Fee Payment Receipt</label>
            <input type="file" id="examFeeReceipt">

            <button class="submit">Register for Exam</button>

        </form>

    </div>


    <!-- COURSE REGISTRATION -->

    <div id="course" class="form-section">

        <h2>Course Registration</h2>

        <form>

            <label>Student Name</label>
            <input type="text">

            <label>Student ID</label>
            <input type="text">

            <label>Select Course</label>
            <select>
                <option>Select Course</option>
                <option>Artificial Intelligence</option>
                <option>Machine Learning</option>
                <option>Data Science</option>
                <option>Cloud Computing</option>
            </select>

            <label>Previous Semester Marksheet</label>
            <input type="file" id="courseMarksheet">

            <button class="submit">Register Course</button>

        </form>

    </div>


    <!-- CERTIFICATE -->

    <div id="certificate" class="form-section">

        <h2>Certificate Request</h2>

        <form>

            <label>Student Name</label>
            <input type="text">

            <label>Student ID</label>
            <input type="text">

            <label>Certificate Type</label>

            <select>
                <option>Select Certificate</option>
                <option>Bonafide Certificate</option>
                <option>Study Certificate</option>
                <option>Transfer Certificate</option>
                <option>Course Completion Certificate</option>
            </select>

            <label>ID Proof</label>
            <input type="file" id="certificateIdProof">

            <label>Supporting Document</label>
            <input type="file" id="supportingDocument">

            <button class="submit">Request Certificate</button>

        </form>

    </div>

</div>


<script>

function showForm(formId) {

    const forms = document.querySelectorAll(".form-section");

    forms.forEach(function(form) {
        form.classList.remove("active");
    });

    document.getElementById(formId).classList.add("active");
}

</script>

</body>
</html>
