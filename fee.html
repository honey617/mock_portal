<!DOCTYPE html>
<html>
<head>
    <title>Fee Payment</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f6f8;
        }

        .form {
            width: 500px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ccc;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin: 10px 0 20px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #1f3c88;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="form">

    <h2>Fee Payment</h2>

    <label for="StudentName">Student Name</label>
    <input type="text" id="studentName" name="studentname">

    <label for="StudentId">Student ID</label>
    <input type="text" id="studentId" name="studentid">

    <label>Semester</label>
    <select id="semester">
        <option value="">Select Semester</option>
        <option>1-1</option>
        <option>1-2</option>
        <option>2-1</option>
        <option>2-2</option>
    </select>

    <label>Fee Amount</label>
    <input type="number" id="feeAmount">

    <button onclick="submitForm()">Pay Fee</button>

</div>

<script>
function submitForm() {
    alert("Fee payment submitted successfully (Demo)");
}
</script>

</body>
</html>
