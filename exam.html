<!DOCTYPE html>
<html>
<head>
    <title>Exam Registration</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f6f8;
        }

        .form {
            width: 500px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ccc;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin: 10px 0 20px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #1f3c88;
            color: white;
            border: none;
        }
    </style>
</head>

<body>

<div class="form">

    <h2>Exam Registration</h2>

    <label for="Student Name">Student Name</label>
    <input type="text" id="studentName" name="StudentName">

    <label for="RollNumber">Roll Number</label>
    <input type="text" id="rollNumber">

    <label>Semester</label>
    <select id="semester">
        <option value="">Select Semester</option>
        <option>2-1</option>
        <option>2-2</option>
    </select>

    <label for="Examfee">Exam Fee</label>
    <input type="number" id="examFee" name="Examfee">

    <button onclick="submitForm()">Register for Exam</button>

</div>

<script>
function submitForm() {
    alert("Exam registration submitted successfully (Demo)");
}
</script>

</body>
</html>
